[project]
name = "pipecat-effects"
version = "0.1.0"
description = "Output audio effects for pipecat. One filter, 8 effects and a loudness meter."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Softcery" }]
keywords = ["pipecat", "audio", "effects", "voice"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "pipecat-ai>=1.10,<2",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.urls]
Source = "https://github.com/softcery/pipecat-effects"
Issues = "https://github.com/softcery/pipecat-effects/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B",
    "SIM", "C4", "RUF", "PTH", "RET", "ASYNC", "T20", "ERA",
]

[tool.ruff.lint.isort]
known-first-party = ["pipecat_effects"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
