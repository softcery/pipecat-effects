[project]
name = "pipecat-effects"
version = "0.1.0"
description = "Output audio effects for pipecat. One filter, 8 effects, 3 presets and a loudness meter."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Softcery" }]
keywords = ["pipecat", "audio", "effects", "voice"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "pipecat-ai>=1.10,<2",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.urls]
Source = "https://github.com/softcery/scs-agent/tree/main/plugins/effects"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
