[project]
name = "pipecat-effects"
version = "0.1.0"
description = "Audio effects for the output of a pipecat bot."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Softcery" }]
keywords = ["pipecat", "audio", "effects", "voice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = [
    "pipecat-ai>=1.10,<2",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.urls]
Source = "https://github.com/softcery/pipecat-effects"
Issues = "https://github.com/softcery/pipecat-effects/issues"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.uv]
required-version = ">=0.12.13,<0.13"

[tool.ruff]
line-length = 100
src = ["src", "examples"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B",
    "SIM", "C4", "RUF", "PTH", "RET", "ASYNC", "T20", "ERA",
    "S", "BLE", "A", "N", "PIE", "PERF", "FURB", "NPY", "PT", "PGH", "PLE", "PLW", "TRY",
]
ignore = ["TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["pipecat_effects"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"

[tool.pytest]
asyncio_mode = "auto"
strict = true
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"
